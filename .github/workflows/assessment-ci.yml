name: Assessment CI - Backend
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 4_rest_api/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r 4_rest_api/requirements.txt
      - name: Test logic exercises
        run: python -m unittest discover -s 1_logic_test -v
      - name: Django system checks
        working-directory: 4_rest_api
        run: python manage.py check
      - name: Django API tests
        working-directory: 4_rest_api
        run: python manage.py test -v 2
      - name: Verify migrations
        working-directory: 4_rest_api
        run: python manage.py makemigrations --check --dry-run
